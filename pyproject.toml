[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fanglei-economy-content-engine"
version = "0.5.0"
description = "Artifact-first CLI for economic explainer research workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
fanglei = "fanglei.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fanglei"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["integration: requires real external provider credentials and network"]
